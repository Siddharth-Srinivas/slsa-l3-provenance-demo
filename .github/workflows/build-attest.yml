name: Build and attest

# Trusted builder for release binaries (SLSA v1.0 Build Level 3).
#
# It takes no inputs, so a calling workflow can't change what is built or
# attested. The provenance certificate names this file as the signer, which
# is what verifiers pin with:
#   gh attestation verify --signer-workflow <owner>/<repo>/.github/workflows/build-attest.yml
on:
  workflow_call:
    outputs:
      subjects:
        description: Base64-encoded sha256sum lines for every attested file.
        value: ${{ jobs.build.outputs.subjects }}

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No id-token permission: build and test code can't mint signing credentials.
    permissions:
      contents: read
    outputs:
      subjects: ${{ steps.checksums.outputs.subjects }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate release tag
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$'
          if [[ "$REF_TYPE" != tag || ! "$REF_NAME" =~ $semver ]]; then
            echo "::error::Release builds must run on a semver tag such as v1.2.3, not ${REF_TYPE} ${REF_NAME}."
            exit 1
          fi
          echo "version=$REF_NAME" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: false # never restore a cache into a release build

      - name: Test
        run: go test ./...

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            goos="${target%/*}"
            goarch="${target#*/}"
            ext=""
            if [[ "$goos" == windows ]]; then ext=".exe"; fi
            GOOS="$goos" GOARCH="$goarch" go build -trimpath \
              -ldflags="-s -w -buildid= -X main.version=${VERSION}" \
              -o "dist/slsa-l3-provenance-demo_${VERSION}_${goos}_${goarch}${ext}" .
          done

      - name: Compute checksums
        id: checksums
        working-directory: dist
        run: |
          sha256sum -- * > "$RUNNER_TEMP/SHA256SUMS"
          mv "$RUNNER_TEMP/SHA256SUMS" SHA256SUMS
          cat SHA256SUMS
          # SHA256SUMS is attested too, so consumers can verify it instead of every binary.
          echo "subjects=$({ cat SHA256SUMS; sha256sum SHA256SUMS; } | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  provenance:
    name: Sign SLSA provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write # request a Sigstore certificate bound to this workflow's identity
      attestations: write # store the attestation in the repository's attestation API
    steps:
      # The subjects come from the build job's outputs, not from a downloaded
      # artifact, so nothing else in the run can swap the files being attested.
      - name: Write attestation subjects
        env:
          SUBJECTS: ${{ needs.build.outputs.subjects }}
        run: base64 -d <<< "$SUBJECTS" > "$RUNNER_TEMP/subjects.sha256"

      - name: Generate SLSA build provenance
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: ${{ runner.temp }}/subjects.sha256

      - name: Stage Sigstore bundle
        env:
          BUNDLE_PATH: ${{ steps.attest.outputs.bundle-path }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          mkdir provenance
          cp "$BUNDLE_PATH" "provenance/slsa-l3-provenance-demo_${VERSION}.sigstore.json"

      - name: Upload Sigstore bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: provenance
          path: provenance/
          if-no-files-found: error
          retention-days: 7
